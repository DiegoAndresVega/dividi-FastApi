# Dependabot abre pull requests cuando sale una version nueva. Se revisa el
# aviso de seguridad de cada una antes de fusionarla: el CI dice si la suite
# pasa, no si el cambio es buena idea.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
